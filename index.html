<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <div id="app">
      <h1>🎱 내 번호 당첨 확인 🎱</h1>
      <main>
        <div class="lotto-price">
          <p>구입할 금액을 입력해주세요.</p>
          <form>
            <input type="number" placeholder="금액" min="1000" />
            <button type="submit">구입</button>
          </form>
        </div>
        <div class="lotto-result">
          <p class="lotto-count"></p>
          <ul class="lotto-list"></ul>
        </div>
        <div class="winning-lotto">
          <p>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>

          <form>
            <div class="numbers-row">
              <label for="winning-number">당첨 번호</label>
              <input name="winning-number" type="number" min="1" max="45" />
              <input name="winning-number" type="number" min="1" max="45" />
              <input name="winning-number" type="number" min="1" max="45" />
              <input name="winning-number" type="number" min="1" max="45" />
              <input name="winning-number" type="number" min="1" max="45" />
              <input name="winning-number" type="number" min="1" max="45" />

              <label for="bonus-number">보너스 번호</label>
              <input name="bonus-number" type="number" min="1" max="45" />
            </div>

            <button type="submit">결과 확인하기</button>
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
