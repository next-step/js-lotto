<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
  <header>
    <h1>🎱 행운의 로또</h1>
  </header>
  <main>
    <section class="input-group">
      <p class="input-label">구입할 금액을 입력해 주세요.</p>
      <article class="input-container">
          <input id="amountInput" placeholder="금액" />
          <button id="buyButton">구입</button>
      </article>
    </section>
    <article id="lottoTickets"></article>
    <section class="winning-section">
        <p class="winning-label">지난 주 당첨번호 6개와 보너스 번호 1개를 입력해 주세요.</p>

      <section class="winning-inputs">
          <!-- 당첨 번호 입력 그룹 -->
        <article class="numbers-group">
            <label class="winning-label-small">당첨 번호</label>
            <div class="winning-numbers">
              <label>
                <input class="winning-number">
              </label>
              <label>
                <input class="winning-number">
              </label>
              <label>
                <input class="winning-number">
              </label>
              <label>
                <input class="winning-number">
              </label>
              <label>
                <input class="winning-number">
              </label>
              <label>
                <input class="winning-number">
              </label>
            </div>
        </article>

          <!-- 보너스 번호 입력 그룹 -->
        <article class="bonus-group">
            <label class="winning-label-small">보너스 번호</label>
            <input class="bonus-number">
        </article>
      </section>

        <button id="checkResultsButton">결과 확인하기</button>
    </section>
  </main>
    <script type="module" src="./src/step2-index.js"></script>
    <link href="style.css" rel="stylesheet">
  </body>
</html>
